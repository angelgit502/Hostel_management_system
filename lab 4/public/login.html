<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login - Hostel Management System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/layout.css">
</head>

<body>
    <!-- Shared Navbar -->
    <header class="header" id="header">
        <div class="container navbar">
            <a href="index.html" class="logo">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M19 21V5a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m-1 4h1m5-12h1m-1 4h1m-1 4h1M9 21v-4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v4" />
                </svg>
                Hostel Management
            </a>

            <button class="hamburger" id="hamburger" aria-label="Toggle navigation menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav>
                <ul class="nav-menu" id="nav-menu">
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="register.html" class="nav-link">Register</a></li>
                    <li><a href="login.html" class="nav-link active">Login</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="section-block login-wrapper">
        <div class="container login-container">
            <div class="login-card">
                <div class="section-header compact-header">
                    <span class="section-tag">Role Login</span>
                    <h2 class="section-title">Portal Login</h2>
                    <p>Access your hostel management dashboard.</p>
                </div>

                <form id="login-form">
                    <div class="form-group">
                        <label for="login-role">Select Role</label>
                        <select id="login-role" class="form-input" required>
                            <option value="student" selected>Student</option>
                            <option value="staff">Staff</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="login-email">Email Address</label>
                        <input type="email" id="login-email" class="form-input"
                            placeholder="e.g. john.doe@university.edu" required>
                    </div>
                    <div class="form-group">
                        <label for="login-pwd">Password</label>
                        <input type="password" id="login-pwd" class="form-input" placeholder="Enter password"
                            required>
                    </div>
                    <div class="login-row">
                        <label class="checkbox-label"><input type="checkbox"> Remember me</label>
                        <button type="button" class="text-button" id="forgot-password">Forgot Password?</button>
                    </div>
                    <button type="submit" class="btn btn-primary full-width">Login to Dashboard</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-bottom">
            <p>&copy; 2026 Hostel Management System. All rights reserved.</p>
        </div>
    </footer>

    <!-- Toast Notification -->
    <div class="toast" id="app-toast">
        <div class="toast-icon">OK</div>
        <div class="toast-text" id="toast-message">Success Message!</div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
